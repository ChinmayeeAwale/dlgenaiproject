retrieval:
  vector_store: faiss
  index_path: data/corpus/index/faiss.index
  metadata_path: data/corpus/index/metadata.jsonl
  top_k: 5

embedding:
  model_name: BAAI/bge-base-en-v1.5
  normalize_embeddings: true

chunking:
  chunk_size: 800
  chunk_overlap: 120

generation:
  ollama_model: finance-rag
  max_context_chunks: 5
  temperature: 0.1
  max_tokens: 512

guardrails:
  require_citations: true
  answer_from_context_only: true
  refuse_personal_investment_advice: true
